[package]
name = "tough"
version = "0.24.0"
description = "The Update Framework (TUF) repository client"
authors = ["iliana destroyer of worlds <iweller@amazon.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/awslabs/tough"
keywords = ["tuf", "update", "repository"]
edition = "2018"

[dependencies]
async-recursion.workspace = true
async-trait.workspace = true
aws-lc-rs.workspace = true
bytes.workspace = true
dyn-clone.workspace = true
futures.workspace = true
futures-core.workspace = true
globset.workspace = true
hex.workspace = true
jiff.workspace = true
log.workspace = true
olpc-cjson = { version = "0.1", path = "../olpc-cjson" }
pem.workspace = true
percent-encoding.workspace = true
reqwest = { workspace = true, optional = true, default-features = false, features = ["stream", "rustls-no-provider"] }
rustls.workspace = true
rustls-native-certs = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_plain.workspace = true
snafu = { workspace = true, features = ["futures"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "sync", "fs", "rt", "time"] }
tokio-util.workspace = true
typed-path.workspace = true
untrusted.workspace = true
url.workspace = true
walkdir.workspace = true

[dev-dependencies]
failure-server = { path = "../integ/failure-server" }
hex-literal.workspace = true
httptest.workspace = true
maplit.workspace = true
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
tokio-test = "0.4"

[features]
fips = ["aws-lc-rs/fips", "rustls/fips"]
http = ["reqwest", "rustls-platform-verifier"]
http2 = ["http", "reqwest/http2"]

# The `integ` feature enables integration tests. The chaos proxy runs in-process
# (via the `failure-server` crate); no external binaries are required.
integ = []
