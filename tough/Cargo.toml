[package]
name = "tough"
version = "0.22.0"
description = "The Update Framework (TUF) repository client"
authors = ["iliana destroyer of worlds <iweller@amazon.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/awslabs/tough"
keywords = ["tuf", "update", "repository"]
edition = "2018"

[dependencies]
async-recursion = "1"
async-trait = "0.1"
aws-lc-rs = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "alloc", "serde", "clock"] }
dyn-clone = "1"
futures = "0.3"
futures-core = "0.3"
globset = { version = "0.4" }
hex = "0.4"
log = "0.4"
olpc-cjson = { version = "0.1", path = "../olpc-cjson" }
pem = "3"
percent-encoding = "2"
reqwest = { version = "0.13", optional = true, default-features = false, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_plain = "1"
snafu = { version = "0.8", features = ["futures"] }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["io-util", "sync", "fs", "rt", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
typed-path = "0.9"
# pinned due to aws-lc-rs locked to this version
# https://github.com/aws/aws-lc-rs/issues/468
untrusted = "0.7.1"
url = "2"
walkdir = "2"

[dev-dependencies]
failure-server = { path = "../integ/failure-server" }
hex-literal = "0.4"
httptest = "0.16"
maplit = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
tokio-test = "0.4"

[features]
fips = ["aws-lc-rs/fips"]
# Enables `HttpTransport` (and pulls in `reqwest`). Does NOT pick a TLS
# backend on its own — enable `http-rustls-tls` or `http-native-tls` to
# get TLS, or let another crate in the dep graph configure `reqwest`.
http = ["dep:reqwest"]
# Use `rustls` (with `aws-lc-rs` as the crypto provider) for HTTPS via
# `reqwest`. Note: in reqwest 0.13 the feature was renamed from
# `rustls-tls` to `rustls`; reqwest installs the `aws-lc-rs` provider
# on its own when this feature is enabled.
http-rustls-tls = ["http", "reqwest/rustls"]
# Use the platform's native TLS stack (OpenSSL / Secure Transport /
# SChannel) for HTTPS via `reqwest`. Avoids pulling in `rustls`.
http-native-tls = ["http", "reqwest/native-tls"]

# The `integ` feature enables integration tests. These tests require `noxious-server` to be installed on the host.
integ = []
