[package]
name = "tough-kms"
version = "0.16.0"
description = "Implements AWS KMS as a key source for TUF signing keys"
authors = ["Shailesh Gothi <gothisg@amazon.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/awslabs/tough"
keywords = ["TUF", "KMS"]
edition = "2018"

[features]
default = ["aws-sdk-rust"]
aws-sdk-rust = ["aws-sdk-rust-rustls"]
# This feature is for backward compatibility but has no effect.
aws-sdk-rust-rustls = []
fips = ["aws-lc-rs/fips", "tough/fips"]

[dependencies]
tough = { version = "0.24", path = "../tough", features = ["http"] }
aws-config.workspace = true
aws-lc-rs.workspace = true
aws-sdk-kms.workspace = true
aws-smithy-http-client.workspace = true
snafu = { workspace = true, features = ["backtraces-impl-backtrace-crate"] }
tokio = { workspace = true, features = ["fs", "io-util", "time", "macros", "rt-multi-thread"] }
pem.workspace = true

[dev-dependencies]
aws-smithy-runtime.workspace = true
aws-smithy-http.workspace = true
aws-smithy-http-client = { workspace = true, features = ["test-util"] }
aws-smithy-types.workspace = true
base64.workspace = true
bytes.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
