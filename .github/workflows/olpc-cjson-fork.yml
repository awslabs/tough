name: olpc-cjson (fork)
# Fork-only: builds just olpc-cjson, with each feature set (the workspace clippy fails in tough).
on:
  pull_request:
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: "0"

jobs:
  olpc-cjson:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup default stable
      - run: rustup component add rustfmt clippy
      - run: cargo fmt -p olpc-cjson -- --check
      - run: cargo clippy --locked -p olpc-cjson -- -D warnings
      - run: cargo clippy --locked -p olpc-cjson --no-default-features --features sonic-rs -- -D warnings
      - run: cargo clippy --locked -p olpc-cjson --all-features --all-targets -- -D warnings
      - run: cargo test --locked -p olpc-cjson --all-features
      - run: cargo test --locked -p olpc-cjson
      - run: cargo test --locked -p olpc-cjson --no-default-features --features sonic-rs
      - name: serde_json is not in the graph with default-features off
        run: "! cargo tree --locked -p olpc-cjson --no-default-features --features sonic-rs -e normal -i serde_json"
