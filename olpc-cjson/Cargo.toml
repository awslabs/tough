[package]
name = "olpc-cjson"
version = "0.1.4"
description = "serde_json or sonic-rs Formatter to serialize as OLPC-style canonical JSON"
authors = ["iliana destroyer of worlds <iweller@amazon.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/awslabs/tough"
keywords = ["json"]
edition = "2018"

[features]
# `serde_json` stays on by default, so nothing changes for existing users.
default = ["serde_json"]
# Implements `serde_json::ser::Formatter` for `CanonicalFormatter`.
serde_json = ["dep:serde_json"]
# Implements `sonic_rs::format::Formatter` for `CanonicalFormatter`. Use it with
# `default-features = false` to leave `serde_json` out of the dependency graph.
sonic-rs = ["dep:sonic-rs"]

[dependencies]
serde = "1"
serde_json = { version = "1", optional = true }
sonic-rs = { version = "0.5", optional = true }
unicode-normalization = "0.1"

[dev-dependencies]
serde_derive = "1"
# the tests compare the two formatters, and build their inputs with it
serde_json = "1"
sonic-rs = "0.5"

[[bin]]
name = "olpc-cjson"
path = "src/main.rs"
required-features = ["serde_json"]
