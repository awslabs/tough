[package]
name = "tough-ssm"
version = "0.19.0"
description = "Implements AWS SSM as a key source for TUF signing keys"
authors = ["Zac Mrowicki <mrowicki@amazon.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/awslabs/tough"
keywords = ["TUF", "SSM"]
edition = "2018"

[features]
default = ["aws-sdk-rust"]
aws-sdk-rust = ["aws-sdk-rust-rustls"]
# This feature is for backward compatibility but has no effect.
aws-sdk-rust-rustls = []
fips = ["tough/fips"]

[dependencies]
tough = { version = "0.24", path = "../tough", features = ["http"] }
aws-sdk-ssm.workspace = true
aws-config.workspace = true
aws-smithy-http-client.workspace = true
snafu = { workspace = true, features = ["backtraces-impl-backtrace-crate"] }
tokio = { workspace = true, features = ["fs", "io-util", "time", "macros", "rt-multi-thread"] }
